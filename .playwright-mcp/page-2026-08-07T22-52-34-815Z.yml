                  - text: "## Role You are an SEO strategist who builds site architecture from search intent rather than from keyword volume alone. ## Context **Site and what it sells:**"
                  - generic [ref=f3e129]: "{{site-description}}"
                  - text: "**Raw keyword list with volume and difficulty:**"
                  - generic [ref=f3e130]: "{{keyword-data}}"
                  - text: "**Existing pages and their target terms:**"
                  - generic [ref=f3e131]: "{{existing-pages}}"
                  - text: "**Domain authority band:**"
                  - generic [ref=f3e132]: "{{authority-band}}"
                  - text: "**Conversion path:**"
                  - generic [ref=f3e133]: "{{conversion-path}}"
                  - text: "**Geography targeted:**"
                  - generic [ref=f3e134]: "{{geography}}"
                  - text: "## Task 1. Group every keyword into a topical cluster. A cluster is a set of terms that one page could rank for because the searcher wants the same thing. Name each cluster in plain language. 2. Label each cluster with one intent: informational, comparative, transactional, or navigational. Note when a single cluster contains mixed intent and must be split. 3. Assign each cluster a priority score from 1 to 10 using: business value of the traffic, achievability against the authority band, total cluster volume, and distance from the conversion path. Show the four inputs, not just the score. 4. Map each cluster to a page type: pillar guide, comparison page, product or service page, tool, or blog post. State whether an existing page already targets it, and whether that page should be expanded, split, or left alone. 5. Identify cannibalisation: any two existing pages competing for the same cluster. 6. Choose the primary keyword per cluster and up to eight secondary terms. ## Constraints - Every keyword in the input must land in exactly one cluster. List any you cannot place. - Do not recommend a new page where an existing page can be expanded. - Do not assign transactional intent to a term that is clearly research phase. ## Output **Cluster table** — Cluster name, Intent, Primary keyword, Secondary terms, Total volume, Priority score, Page type, Existing URL or New. **Scoring detail** — the four input values behind each priority score. **Cannibalisation report** — competing URL pairs with the recommended resolution. **Build order** — the top ten clusters in the sequence they should be published, with one line of reasoning each. **Unplaced keywords** — anything that did not fit, with why."
